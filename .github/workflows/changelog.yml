name: 업데이트 기록 자동 갱신

# 도구 파일(*.html)이나 추가 기록 파일을 올리면 허브(index.html)의 업데이트 기록을 다시 만듭니다.
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '.github/changelog-extra.json'
      - '.github/scripts/update_changelog.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 업데이트 기록 만들기
        run: python .github/scripts/update_changelog.py .
      - name: 바뀌었으면 저장
        run: |
          if git diff --quiet; then
            echo "바뀐 기록 없음"
            exit 0
          fi
          git config user.name  "changelog-bot"
          git config user.email "changelog-bot@users.noreply.github.com"
          git add index.html
          git commit -m "업데이트 기록 자동 갱신"
          git push
